<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#27644c" />
    <title>Lexi IELTS — Mỗi ngày, thêm một chút tự tin</title>
  </head>
  <body>
    <div id="root">
      <section
        style="
          max-width: 560px;
          margin: 18vh auto;
          padding: 28px;
          font-family: system-ui, sans-serif;
          line-height: 1.8;
          color: #284a38;
          background: #f4f7ef;
          border-radius: 16px;
        "
      >
        <h1>Lexi IELTS</h1>
        <p id="startup-status" role="status">Đang tải góc học của bạn…</p>
        <button
          type="button"
          onclick="location.reload()"
          style="
            padding: 12px 18px;
            border: 1px solid #27644c;
            border-radius: 8px;
            color: #fff;
            background: #27644c;
            cursor: pointer;
          "
        >
          Tải lại trang
        </button>
        <noscript
          ><p>
            Bạn cần bật JavaScript để sử dụng và lưu tiến độ học trên thiết bị.
          </p></noscript
        >
      </section>
    </div>
    <script>
      window.addEventListener(
        "error",
        function () {
          var status = document.getElementById("startup-status");
          if (status)
            status.textContent =
              "Không tải được ứng dụng. Hãy tải lại trang hoặc kiểm tra kết nối. Dữ liệu học trên thiết bị chưa bị xóa.";
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
